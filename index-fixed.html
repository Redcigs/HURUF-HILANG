
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Tes Huruf Acak</title>
  <style>
    body {
      font-family: sans-serif;
      background-color: #001066;
      color: white;
      text-align: center;
      padding: 20px;
    }
    .grid, .choice {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin: 10px 0;
    }
    .box {
      border: 2px solid white;
      padding: 15px;
      font-size: 24px;
      width: 50px;
      height: 50px;
    }
    button {
      font-size: 18px;
      padding: 10px 20px;
      margin-top: 10px;
    }
    .result {
      margin-top: 20px;
      font-size: 20px;
    }
    #timer, #score {
      font-size: 24px;
      margin-bottom: 10px;
    }
  </style>

<style>
  body {
    background-color: white;
    font-family: Arial, sans-serif;
    text-align: center;
    color: black;
  }
  .timer {
    font-size: 24px;
    color: orange;
    margin: 10px 0;
  }
  .column-header {
    font-size: 36px;
    font-weight: bold;
    margin: 20px 0;
  }
  .letter-boxes {
    display: flex;
    justify-content: center;
    margin: 20px 0;
  }
  .letter-box {
    border: 5px solid orange;
    border-radius: 10px;
    margin: 0 5px;
    padding: 20px 30px;
    font-size: 32px;
    font-weight: bold;
    width: 80px;
    height: 80px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .answer-buttons {
    display: flex;
    justify-content: center;
    margin: 30px 0;
  }
  .answer-buttons button {
    font-size: 24px;
    padding: 15px 25px;
    margin: 0 10px;
    border: 3px solid orange;
    background-color: white;
    color: black;
    border-radius: 8px;
    cursor: pointer;
  }
</style>

</head>
<body>
  <h1>Tes Huruf Acak</h1>
  <div id="timer">Waktu: 60 detik</div>
  <div id="score">Skor: 0</div>
  <div><strong>Kolom <span id="column-number">1</span> dari 10</strong></div>
  <div class="grid" id="reference-row"></div>
  <div class="grid">
    <div class="box">A</div>
    <div class="box">B</div>
    <div class="box">C</div>
    <div class="box">D</div>
    <div class="box">E</div>
  </div>

  <div><strong>Huruf Acak:</strong></div>
  <div class="grid" id="target-word"></div>

  <div class="choice">
    <button onclick="checkAnswer(0)">A</button>
    <button onclick="checkAnswer(1)">B</button>
    <button onclick="checkAnswer(2)">C</button>
    <button onclick="checkAnswer(3)">D</button>
    <button onclick="checkAnswer(4)">E</button>
  </div>

  <div class="result" id="result"></div>

  <script>
    const totalRounds = 400;
    let currentRound = 0;
    let correctIndex = 0;
    let timerInterval;
    let timeLeft = 60;
    let score = 0;

    function updateScoreDisplay() {
      document.getElementById('score').textContent = `Skor: ${score}`;
    }

    
    

    function startTimer() {
      timeLeft = 60;
      document.getElementById('timer').textContent = `Waktu: ${timeLeft} detik`;
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        timeLeft--;
        document.getElementById('timer').textContent = `Waktu: ${timeLeft} detik`;
        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          nextRound();
        }
      }, 1000);
    }

    function checkAnswer(index) {
      const resultBox = document.getElementById('result');
      if (index === correctIndex) {
        resultBox.textContent = 'Benar!';
        resultBox.style.color = 'lightgreen';
        score += 40;
      } else {
        resultBox.textContent = 'Salah!';
        resultBox.style.color = 'red';
      }
      updateScoreDisplay();
      clearInterval(timerInterval);
      setTimeout(nextRound, 1000);
    }

    function downloadResult() {
      const now = new Date();
      const timestamp = now.toLocaleString('id-ID');
      const content = `Hasil Tes Huruf Acak\nSkor Akhir: ${score} / 400\nWaktu Selesai: ${timestamp}`;
      const blob = new Blob([content], { type: 'text/plain' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = 'hasil_tes.txt';
      link.click();
    }

    function nextRound() {
      currentRound++;
      if (currentRound < totalRounds) {
        generateRound();
        startTimer();
      } else {
        document.body.innerHTML = `<h1>Tes Selesai!</h1><h2>Skor Akhir: ${score} / 400</h2>`;
        downloadResult();
      }
    }

    generateRound();
    startTimer();
    updateScoreDisplay();
  </script>
</body>
</html>
