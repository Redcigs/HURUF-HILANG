let currentColumn = 0;

let timeLeft = 50;

const timerBox = document.getElementById("timer");
const questionBox = document.getElementById("question-box");
const optionsBox = document.getElementById("options-box");
const finalScore = document.getElementById("final-score");

function startTimer() {
  timeLeft = 50;
  timerBox.textContent = "Sisa Waktu: " + timeLeft;
  timer = setInterval(() => {
    timeLeft--;
    timerBox.textContent = "Sisa Waktu: " + timeLeft;
    if (timeLeft <= 0) {
      clearInterval(timer);
      nextColumn();
    }
  }, 1000);
}

function showQuestion() {
  const q = columns[currentColumn][currentQuestion];
  questionBox.innerHTML = "<div class='question'>Soal " + (currentQuestion + 1) + ": " + q.sequence + "</div>";
  optionsBox.innerHTML = "";
  q.options.forEach(opt => {
    const btn = document.createElement("button");
    btn.textContent = opt;
    btn.onclick = () => {
      if (opt === q.correct) score++;
      currentQuestion++;
      if (currentQuestion >= columns[currentColumn].length) {
        clearInterval(timer);
        nextColumn();
      } else {
        showQuestion();
      }
    };
    optionsBox.appendChild(btn);
  });
}

function nextColumn() {
  currentColumn++;
  currentQuestion = 0;
  if (currentColumn >= columns.length) {
    showFinalScore();
  } else {
    startTimer();
    showQuestion();
  }
}

function showFinalScore() {
  document.getElementById("column-container").classList.add("hidden");
  timerBox.classList.add("hidden");
  finalScore.classList.remove("hidden");
  finalScore.innerHTML = "<h2>Skor Akhir: " + score + " dari " + (columns.length * 40) + "</h2>";
}

startTimer();
showQuestion();
